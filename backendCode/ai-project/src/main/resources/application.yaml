server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # Spring AI 配置（阿里云百炼，兼容 OpenAI 接口；api-key 从环境变量 DASHSCOPE_API_KEY 读取）
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        completions-path: /v1/chat/completions
        options:
          model: qwen-plus
# JWT配置
jwt:
  secret: MySecretKeyForJWT2025!@#$%^&*()_+SecureKeyHere
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀
# 阿里云 OSS（AccessKey 从环境变量读取，禁止写死入库）
oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  bucket: psychology-ai
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  url-prefix: https://psychology-ai.oss-cn-beijing.aliyuncs.com