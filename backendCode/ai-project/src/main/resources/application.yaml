server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mental_health_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  # Redis：登出 token 黑名单（host/port/password 可用环境变量覆盖）
  # 说明：黑名单是补充手段，Redis 不可用时校验会降级放行并打 ERROR 日志，不会拖垮主流程
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      connect-timeout: 2s   # 连接超时：宁可快速失败，也不让请求线程卡住
      timeout: 3s           # 命令超时
  # Spring AI 配置（阿里云百炼，兼容 OpenAI 接口；api-key 从环境变量 DASHSCOPE_API_KEY 读取）
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        completions-path: /v1/chat/completions
        options:
          model: qwen-plus
# JWT配置（secret 可通过环境变量覆盖，默认仅用于本地开发）
jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWT2025_DevOnly_ChangeMe!_SecureKeyHere}
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀
# 阿里云 OSS（AccessKey 从环境变量读取，禁止写死入库）
oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  bucket: psychology-ai
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  url-prefix: https://psychology-ai.oss-cn-beijing.aliyuncs.com